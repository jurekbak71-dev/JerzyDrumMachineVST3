name: Build Windows VST3
on: [push, pull_request, workflow_dispatch]
concurrency:
 group: jerzy-drum-machine-${{ github.ref }}
 cancel-in-progress: true
jobs:
 build:
  runs-on: windows-2022
  steps:
   - uses: actions/checkout@v4
   - uses: lukka/get-cmake@latest
   - name: Checkout JUCE
     uses: actions/checkout@v4
     with:
      repository: juce-framework/JUCE
      ref: 8.0.4
      path: JUCE
   - name: Configure
     run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DJUCE_DIR="${{ github.workspace }}/JUCE"
   - name: Build
     id: production_build
     run: cmake --build build --config Release --target JerzyDrumMachine_VST3 JerzyDrumMachine_Standalone
   - name: Build DSP smoke test
     id: smoke_build
     run: cmake --build build --config Release --target JerzyDrumMachineTests
   - name: Run DSP smoke test
     shell: pwsh
     run: |
      $testPath = "build/JerzyDrumMachineTests_artefacts/Release/JerzyDrumMachineTests.exe"
      & $testPath
      $testExitCode = $LASTEXITCODE
      if (Test-Path "smoke-diagnostics.txt") {
       Get-Content "smoke-diagnostics.txt" | Write-Output
      } else {
       Write-Output "DSP smoke test did not create smoke-diagnostics.txt"
      }
      if ($testExitCode -ne 0) {
       throw "DSP smoke test failed with exit code $testExitCode"
      }
   - name: Package
     shell: pwsh
     run: |
      Compress-Archive -Path "build/JerzyDrumMachine_artefacts/Release/VST3/Jerzy Drum Machine.vst3" -DestinationPath "JerzyDrumMachine-VST3-Windows-x64.zip"
      Compress-Archive -Path "build/JerzyDrumMachine_artefacts/Release/Standalone/Jerzy Drum Machine.exe" -DestinationPath "JerzyDrumMachine-Standalone-Windows-x64.zip"
   - uses: actions/upload-artifact@v4
     with:
      name: JerzyDrumMachine-Windows-x64
      path: |
       JerzyDrumMachine-VST3-Windows-x64.zip
       JerzyDrumMachine-Standalone-Windows-x64.zip
