name: Build Windows VST3
on: [push, workflow_dispatch]
jobs:
 build:
  runs-on: windows-latest
  steps:
   - uses: actions/checkout@v4
   - uses: lukka/get-cmake@latest
   - name: Configure
     run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64
   - name: Build
     run: cmake --build build --config Release --target JerzyDrumMachine_VST3
   - name: Package
     shell: pwsh
     run: Compress-Archive -Path "build/JerzyDrumMachine_artefacts/Release/VST3/Jerzy Drum Machine.vst3" -DestinationPath "JerzyDrumMachine-Windows-x64.zip"
   - uses: actions/upload-artifact@v4
     with:
      name: JerzyDrumMachine-Windows-x64
      path: JerzyDrumMachine-Windows-x64.zip
