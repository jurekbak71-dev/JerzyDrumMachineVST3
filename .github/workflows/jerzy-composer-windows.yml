name: Jerzy Composer and FL Bridge EXE Windows
on:
  push:
    branches:
      - feature/jerzy-fl-bridge-desktop-exe
  pull_request:
    paths:
      - 'tools/ComposerVST3/**'
      - 'tools/FLStudioBridge/**'
      - '.github/workflows/jerzy-composer-windows.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Install .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Install Python for Piano Roll tests
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check native Piano Roll scripts
        shell: pwsh
        run: |
          Get-ChildItem "tools/FLStudioBridge/piano_roll_scripts/*.pyscript" | ForEach-Object { python -m py_compile $_.FullName }
          python -m unittest discover -s tools/FLStudioBridge/tests -p "test_*.py" -v
          if ($LASTEXITCODE -ne 0) { throw "Composer musical smoke tests failed" }
      - name: Build portable Windows EXE
        shell: pwsh
        run: |
          dotnet publish tools/FLStudioBridge/JerzyFLBridge.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:PublishTrimmed=false -p:IncludeNativeLibrariesForSelfExtract=true -p:DebugType=None -o dist/EXE
          if ($LASTEXITCODE -ne 0) { throw "EXE publish failed" }
          New-Item -ItemType Directory -Force dist/EXE/PianoRollScripts | Out-Null
          Copy-Item "tools/FLStudioBridge/piano_roll_scripts/*.pyscript" -Destination "dist/EXE/PianoRollScripts/"
          Compress-Archive -Path "dist/EXE/*" -DestinationPath "dist/Jerzy-FLBridge-EXE-Windows-x64.zip"
      - name: Checkout JUCE 8
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 8.0.4
          path: JUCE
      - name: Configure Composer VST3
        shell: pwsh
        run: cmake -S tools/ComposerVST3 -B build-composer -G "Visual Studio 17 2022" -A x64 -DJUCE_DIR="$($pwd.Path)/JUCE"
      - name: Build Composer VST3 and core tests
        shell: pwsh
        run: cmake --build build-composer --config Release --target JerzyComposer_VST3 ComposerCoreTests --parallel 2
      - name: Test Composer core
        shell: pwsh
        run: ctest --test-dir build-composer -C Release --output-on-failure
      - name: Package Composer VST3
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist/Composer | Out-Null
          $vst = "build-composer/JerzyComposer_artefacts/Release/VST3/Jerzy Composer.vst3"
          if (-not (Test-Path $vst)) { throw "VST3 bundle missing: $vst" }
          Copy-Item -Path $vst -Destination "dist/Composer/" -Recurse
          Compress-Archive -Path "dist/Composer/*" -DestinationPath "dist/Jerzy-Composer-VST3-Windows-x64.zip"
      - name: Package complete Composer Windows set
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "dist/Full/Program" | Out-Null
          New-Item -ItemType Directory -Force "dist/Full/VST3" | Out-Null
          Copy-Item -Path "dist/EXE/*" -Destination "dist/Full/Program/" -Recurse
          Copy-Item -Path "dist/Composer/*" -Destination "dist/Full/VST3/" -Recurse
          @(
            "JERZY COMPOSER 0.4 - WINDOWS x64"
            ""
            "1. Uruchom Program/JerzyFLBridge.exe i zainstaluj skrypty FL Studio."
            "2. Skopiuj caly folder VST3/Jerzy Composer.vst3 do C:\Program Files\Common Files\VST3."
            "3. W FL Studio: Options > Manage plugins > Find installed plugins."
            "4. Dodaj Jerzy Composer do Channel Rack; ustaw Generator MIDI = ON, Partia = Bas."
            "5. W wrapperze Composer ustaw MIDI Output port = 10."
            "6. W wrapperze syntezatora ustaw MIDI Input port = 10."
            "7. Nacisnij PLAY. Composer wysyla MIDI i NIE generuje sam audio."
            ""
            "MIDI VST3 routing zalezy od wersji i konfiguracji FL Studio."
            "Jesli host nie przekazuje MIDI z VST3, uzyj skryptu Piano Roll."
            "Nie zmieniaj ani nie nadpisuj istniejacej Drum Machine."
            "Repozytorium: https://github.com/jurekbak71-dev/JerzyDrumMachineVST3/pull/6"
          ) | Set-Content -Encoding utf8 "dist/Full/START_TUTAJ.txt"
          Compress-Archive -Path "dist/Full/*" -DestinationPath "dist/Jerzy-Composer-Komplet-Windows-x64.zip"
      - name: Upload complete Composer Windows package
        uses: actions/upload-artifact@v4
        with:
          name: Jerzy-Composer-Komplet-Windows-x64
          path: dist/Jerzy-Composer-Komplet-Windows-x64.zip
          if-no-files-found: error
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: Jerzy-FLBridge-EXE-Windows-x64
          path: dist/Jerzy-FLBridge-EXE-Windows-x64.zip
          if-no-files-found: error
      - name: Upload VST3
        uses: actions/upload-artifact@v4
        with:
          name: Jerzy-Composer-VST3-Windows-x64
          path: dist/Jerzy-Composer-VST3-Windows-x64.zip
          if-no-files-found: error
