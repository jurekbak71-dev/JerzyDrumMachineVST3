name: GUI Family Windows VST3
on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Checkout JUCE
        uses: actions/checkout@v4
        with:
          repository: juce-framework/JUCE
          ref: 9.0.3
          path: JUCE
      - name: Configure
        shell: pwsh
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DJUCE_DIR="$env:GITHUB_WORKSPACE/JUCE"
      - name: Build VST3 and tests
        shell: pwsh
        run: cmake --build build --config Release --target JerzyDrumMachine_VST3 JerzyDrumMachineTests --parallel
